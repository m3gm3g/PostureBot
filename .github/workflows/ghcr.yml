name: Container image

# Publishes ghcr.io/m3gm3g/posturebot on every release tag.
# Run it by hand (Actions tab -> Run workflow) to publish the current main.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          python3 -c "import tomllib;print('version='+tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/m3gm3g/posturebot:${{ steps.v.outputs.version }}
            ghcr.io/m3gm3g/posturebot:latest
